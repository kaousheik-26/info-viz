<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attention Heatmap Visualizer</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=DM+Sans:wght@400;500;600;700&display=swap');

        :root {
            --bg: #0c0e13;
            --bg-card: #14171e;
            --bg-raised: #1a1e28;
            --border: #262b38;
            --text: #c8cdd8;
            --text-dim: #6b7280;
            --text-bright: #eef0f4;
            --accent: #4f8ff7;
            --accent-dim: #2a4a7a;
            --selected: #f59e0b;
            --selected-bg: rgba(245, 158, 11, 0.15);
            --danger: #ef4444;
            --mono: 'JetBrains Mono', monospace;
            --sans: 'DM Sans', -apple-system, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--sans);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ── Header ──────────────────────────────────────────────── */
        .header {
            padding: 20px 28px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 16px;
            background: var(--bg-card);
            flex-wrap: wrap;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-bright);
            letter-spacing: -0.3px;
        }

        .header .meta {
            font-size: 12px;
            color: var(--text-dim);
            font-family: var(--mono);
        }

        .header .pill {
            font-size: 11px;
            padding: 3px 10px;
            border-radius: 100px;
            font-weight: 600;
            font-family: var(--mono);
        }

        .pill-model {
            background: var(--accent-dim);
            color: var(--accent);
        }

        .pill-family {
            background: rgba(139, 92, 246, 0.15);
            color: #a78bfa;
        }

        .pill-compressed {
            background: rgba(245, 158, 11, 0.15);
            color: #f59e0b;
        }

        /* ── Token Bar ───────────────────────────────────────────── */
        .token-section {
            padding: 16px 28px;
            border-bottom: 1px solid var(--border);
            background: var(--bg-card);
        }

        .token-section label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-dim);
            margin-bottom: 10px;
        }

        .token-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            max-height: 120px;
            overflow-y: auto;
            padding: 4px 0;
        }

        .token-chip {
            font-family: var(--mono);
            font-size: 12px;
            padding: 4px 7px;
            border-radius: 4px;
            background: var(--bg-raised);
            border: 1px solid var(--border);
            color: var(--text);
            cursor: pointer;
            transition: all 0.12s;
            user-select: none;
            white-space: pre;
            line-height: 1.3;
        }

        .token-chip:hover {
            border-color: var(--accent);
            background: var(--accent-dim);
        }

        .token-chip.selected {
            border-color: var(--selected);
            background: var(--selected-bg);
            color: var(--selected);
            font-weight: 600;
        }

        .token-chip .idx {
            font-size: 9px;
            color: var(--text-dim);
            margin-right: 3px;
            vertical-align: super;
        }

        .token-actions {
            margin-top: 8px;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .token-actions button {
            font-family: var(--sans);
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 4px;
            border: 1px solid var(--border);
            background: var(--bg-raised);
            color: var(--text);
            cursor: pointer;
            transition: all 0.12s;
        }

        .token-actions button:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .selection-info {
            font-size: 12px;
            color: var(--text-dim);
            font-family: var(--mono);
        }

        /* ── Controls ────────────────────────────────────────────── */
        .controls {
            padding: 16px 28px;
            border-bottom: 1px solid var(--border);
            display: flex;
            gap: 32px;
            align-items: center;
            flex-wrap: wrap;
            background: var(--bg);
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .control-group label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            min-width: 55px;
        }

        .control-group input[type="range"] {
            width: 200px;
            accent-color: var(--accent);
        }

        .control-group select {
            font-family: var(--mono);
            font-size: 12px;
            padding: 5px 10px;
            border-radius: 4px;
            border: 1px solid var(--border);
            background: var(--bg-raised);
            color: var(--text);
            cursor: pointer;
        }

        .control-value {
            font-family: var(--mono);
            font-size: 13px;
            color: var(--accent);
            min-width: 50px;
        }

        .control-group .btn-group {
            display: flex;
            gap: 2px;
        }

        .control-group .btn-group button {
            font-family: var(--mono);
            font-size: 11px;
            padding: 4px 10px;
            border: 1px solid var(--border);
            background: var(--bg-raised);
            color: var(--text);
            cursor: pointer;
            transition: all 0.12s;
        }

        .control-group .btn-group button:first-child {
            border-radius: 4px 0 0 4px;
        }

        .control-group .btn-group button:last-child {
            border-radius: 0 4px 4px 0;
        }

        .control-group .btn-group button.active {
            background: var(--accent-dim);
            border-color: var(--accent);
            color: var(--accent);
        }

        /* ── Colormap legend ─────────────────────────────────────── */
        .colormap-legend {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: auto;
        }

        .colormap-bar {
            width: 120px;
            height: 12px;
            border-radius: 2px;
            border: 1px solid var(--border);
        }

        .colormap-label {
            font-family: var(--mono);
            font-size: 10px;
            color: var(--text-dim);
        }

        /* ── Frame Grid ──────────────────────────────────────────── */
        .frame-grid-section {
            padding: 24px 28px;
        }

        .frame-grid-section>label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-dim);
            margin-bottom: 14px;
        }

        .frame-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        .frame-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            transition: border-color 0.15s;
        }

        .frame-card:hover {
            border-color: var(--accent);
        }

        .frame-card-header {
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }

        .frame-card-header .title {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-bright);
        }

        .frame-card-header .tg-badge {
            font-family: var(--mono);
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 3px;
            background: var(--bg-raised);
            color: var(--text-dim);
        }

        .frame-canvas-wrap {
            position: relative;
            width: 100%;
            background: #000;
        }

        .frame-canvas-wrap canvas {
            display: block;
            width: 100%;
            height: auto;
        }

        .frame-attn-score {
            padding: 6px 12px;
            font-family: var(--mono);
            font-size: 11px;
            color: var(--text-dim);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
        }

        .frame-attn-score .score-val {
            color: var(--accent);
        }

        /* ── Loading ─────────────────────────────────────────────── */
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(12, 14, 19, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            gap: 16px;
        }

        .loading-overlay.hidden {
            display: none;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            font-size: 14px;
            color: var(--text-dim);
        }

        /* ── Prompt bar ──────────────────────────────────────────── */
        .prompt-bar {
            padding: 10px 28px;
            font-size: 12px;
            color: var(--text-dim);
            border-bottom: 1px solid var(--border);
            background: var(--bg);
            font-family: var(--mono);
            display: flex;
            gap: 8px;
        }

        .prompt-bar strong {
            color: var(--text);
        }

        /* ── Scrollbar ───────────────────────────────────────────── */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-dim);
        }
    </style>
</head>

<body>

    <div class="loading-overlay" id="loading">
        <div class="spinner"></div>
        <div class="loading-text">Loading attention data …</div>
    </div>

    <div class="header">
        <h1>Attention Heatmap Visualizer</h1>
        <span class="pill pill-model" id="model-name">—</span>
        <span class="pill pill-family" id="model-family">—</span>
        <span class="pill pill-compressed hidden" id="compression-pill">—</span>
        <span class="meta" id="header-stats">—</span>
    </div>

    <div class="prompt-bar">
        <strong>Prompt:</strong>
        <span id="prompt-text">—</span>
    </div>

    <div class="token-section">
        <label>Generated Tokens <span class="selection-info" id="sel-info">(click to select, shift+click for
                range)</span></label>
        <div class="token-bar" id="token-bar"></div>
        <div class="token-actions">
            <button id="btn-select-all">Select All</button>
            <button id="btn-clear">Clear</button>
            <span class="selection-info" id="sel-count">0 selected</span>
        </div>
    </div>

    <div class="controls">
        <div class="control-group">
            <label>Layer</label>
            <input type="range" id="layer-slider" min="0" max="0" value="0">
            <span class="control-value" id="layer-value">0</span>
        </div>

        <div class="control-group">
            <label>Head</label>
            <select id="head-select">
                <option value="avg" selected>Average</option>
            </select>
        </div>

        <div class="control-group">
            <label>Opacity</label>
            <input type="range" id="opacity-slider" min="0" max="100" value="60">
            <span class="control-value" id="opacity-value">60%</span>
        </div>

        <div class="control-group">
            <label>Agg</label>
            <div class="btn-group">
                <button class="active" data-agg="mean">Mean</button>
                <button data-agg="max">Max</button>
            </div>
        </div>

        <div class="control-group">
            <label>Cmap</label>
            <select id="cmap-select">
                <option value="inferno" selected>Inferno</option>
                <option value="hot">Hot</option>
                <option value="viridis">Viridis</option>
                <option value="plasma">Plasma</option>
                <option value="magma">Magma</option>
                <option value="turbo">Turbo</option>
            </select>
        </div>

        <div class="colormap-legend">
            <span class="colormap-label">Low</span>
            <canvas id="colormap-bar" width="120" height="12" class="colormap-bar"></canvas>
            <span class="colormap-label">High</span>
        </div>
    </div>

    <div class="frame-grid-section">
        <label>Frames <span id="frames-subtitle"
                style="text-transform:none;font-weight:400;color:var(--text-dim)"></span></label>
        <div class="frame-grid" id="frame-grid"></div>
    </div>

    <script>
        // ══════════════════════════════════════════════════════════════════════════════
        // Colormaps (256-entry LUTs)
        // ══════════════════════════════════════════════════════════════════════════════
        const COLORMAPS = {};

        function buildLUT(kp) {
            const lut = new Array(256);
            for (let i = 0; i < 256; i++) {
                const t = i / 255;
                let lo = kp[0], hi = kp[kp.length - 1];
                for (let k = 0; k < kp.length - 1; k++) {
                    if (t >= kp[k][0] && t <= kp[k + 1][0]) { lo = kp[k]; hi = kp[k + 1]; break; }
                }
                const f = (hi[0] - lo[0]) > 0 ? (t - lo[0]) / (hi[0] - lo[0]) : 0;
                lut[i] = [
                    Math.round(lo[1] + f * (hi[1] - lo[1])),
                    Math.round(lo[2] + f * (hi[2] - lo[2])),
                    Math.round(lo[3] + f * (hi[3] - lo[3])),
                ];
            }
            return lut;
        }

        COLORMAPS.inferno = buildLUT([
            [0, 0, 0, 4], [.13, 31, 12, 72], [.25, 85, 15, 109], [.38, 136, 34, 106],
            [.5, 186, 54, 85], [.63, 227, 89, 51], [.75, 249, 140, 10], [.88, 249, 200, 40], [1, 252, 255, 164],
        ]);
        COLORMAPS.hot = buildLUT([
            [0, 0, 0, 0], [.33, 230, 0, 0], [.66, 255, 200, 0], [1, 255, 255, 255],
        ]);
        COLORMAPS.viridis = buildLUT([
            [0, 68, 1, 84], [.13, 72, 35, 116], [.25, 64, 67, 135], [.38, 52, 94, 141],
            [.5, 33, 145, 140], [.63, 53, 183, 121], [.75, 109, 205, 89], [.88, 180, 222, 44], [1, 253, 231, 37],
        ]);
        COLORMAPS.plasma = buildLUT([
            [0, 13, 8, 135], [.13, 75, 3, 161], [.25, 126, 3, 168], [.38, 168, 34, 150],
            [.5, 203, 70, 121], [.63, 229, 107, 93], [.75, 248, 148, 65], [.88, 253, 195, 40], [1, 240, 249, 33],
        ]);
        COLORMAPS.magma = buildLUT([
            [0, 0, 0, 4], [.13, 28, 16, 68], [.25, 79, 18, 123], [.38, 129, 37, 129],
            [.5, 181, 54, 122], [.63, 229, 80, 100], [.75, 251, 135, 97], [.88, 254, 194, 140], [1, 252, 253, 191],
        ]);
        COLORMAPS.turbo = buildLUT([
            [0, 48, 18, 59], [.13, 67, 96, 211], [.25, 30, 156, 240], [.38, 18, 206, 170],
            [.5, 82, 237, 93], [.63, 183, 243, 33], [.75, 243, 195, 28], [.88, 244, 116, 15], [1, 122, 4, 3],
        ]);

        function cmapColor(t, name) {
            const lut = COLORMAPS[name] || COLORMAPS.inferno;
            return lut[Math.max(0, Math.min(255, Math.round(t * 255)))];
        }

        // ══════════════════════════════════════════════════════════════════════════════
        // State
        // ══════════════════════════════════════════════════════════════════════════════
        let META = null;
        let selectedSteps = new Set();
        let lastClickedStep = null;
        let frameImages = [];
        let currentHeatmaps = null;
        let aggMode = "mean";
        let currentCmap = "inferno";
        let pendingFetch = null;

        // ══════════════════════════════════════════════════════════════════════════════
        // Init
        // ══════════════════════════════════════════════════════════════════════════════
        async function init() {
            const res = await fetch("/api/metadata");
            META = await res.json();

            // Header
            document.getElementById("model-name").textContent = META.model.split("/").pop();

            const famEl = document.getElementById("model-family");
            famEl.textContent = META.model_family === "qwen2_5_vl" ? "Qwen2.5-VL" : "VideoLLaMA3";

            const compEl = document.getElementById("compression-pill");
            if (META.has_compression) {
                const full = META.num_video_tokens_full || "?";
                compEl.textContent = `compressed ${META.num_video_tokens}/${full}`;
                compEl.classList.remove("hidden");
            }

            document.getElementById("header-stats").textContent =
                `${META.num_layers}L · ${META.num_heads}H · ${META.num_frames}F · ${META.num_temporal_groups}TG · ${META.num_gen_steps}tok`;
            document.getElementById("prompt-text").textContent = META.prompt;

            // Layer slider
            const ls = document.getElementById("layer-slider");
            ls.max = META.num_layers - 1;
            ls.value = META.num_layers - 1;
            document.getElementById("layer-value").textContent = `${ls.value} / ${ls.max}`;

            // Head select
            const hs = document.getElementById("head-select");
            if (META.has_full_attention) {
                for (let i = 0; i < META.num_heads; i++) {
                    const opt = document.createElement("option");
                    opt.value = i; opt.textContent = `Head ${i}`;
                    hs.appendChild(opt);
                }
            }

            // Token bar
            const bar = document.getElementById("token-bar");
            META.generated_tokens.forEach((tok, i) => {
                const chip = document.createElement("div");
                chip.className = "token-chip";
                chip.dataset.step = i;
                const display = tok.replace(/ /g, "\u00b7").replace(/\n/g, "\u21b5") || "\u00b7";
                chip.innerHTML = `<span class="idx">${i}</span>${escapeHtml(display)}`;
                chip.addEventListener("click", (e) => onTokenClick(i, e));
                bar.appendChild(chip);
            });

            // Frames subtitle — adapt to model family
            const tmf = META.temporal_merge_factor;
            let sub = `\u2014 ${META.h_patches}\u00d7${META.w_patches} patches/TG`;
            if (tmf > 1) sub += `, temporal merge \u00d7${tmf}`;
            if (META.has_compression) sub += `, token compression active`;
            document.getElementById("frames-subtitle").textContent = sub;

            await loadFrames();

            // Select first token by default
            toggleStep(0);
            await fetchAndRender();

            document.getElementById("loading").classList.add("hidden");
            drawColormapBar();
        }

        function escapeHtml(s) {
            return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        async function loadFrames() {
            const grid = document.getElementById("frame-grid");
            grid.innerHTML = "";
            frameImages = [];

            const tmf = META.temporal_merge_factor;

            for (let i = 0; i < META.num_frames; i++) {
                const tg = Math.floor(i / tmf);

                const card = document.createElement("div");
                card.className = "frame-card";
                card.id = `frame-card-${i}`;

                const header = document.createElement("div");
                header.className = "frame-card-header";

                let badgeText;
                if (tmf > 1) {
                    const lo = tg * tmf, hi = lo + tmf - 1;
                    badgeText = `TG ${tg}  (frames ${lo}\u2013${hi})`;
                } else {
                    badgeText = `TG ${tg}`;
                }

                header.innerHTML = `
      <span class="title">Frame ${i}</span>
      <span class="tg-badge">${badgeText}</span>
    `;
                card.appendChild(header);

                const wrap = document.createElement("div");
                wrap.className = "frame-canvas-wrap";
                const canvas = document.createElement("canvas");
                canvas.id = `canvas-${i}`;
                wrap.appendChild(canvas);
                card.appendChild(wrap);

                const footer = document.createElement("div");
                footer.className = "frame-attn-score";
                footer.id = `score-${i}`;
                footer.innerHTML = `<span>Attn sum</span><span class="score-val">\u2014</span>`;
                card.appendChild(footer);

                grid.appendChild(card);

                const img = new Image();
                img.crossOrigin = "anonymous";
                img.src = `/api/frames/${i}`;
                frameImages.push(img);
                await new Promise(r => { img.onload = r; img.onerror = r; });

                canvas.width = img.naturalWidth || 1;
                canvas.height = img.naturalHeight || 1;
                const ctx = canvas.getContext("2d");
                if (img.complete && img.naturalWidth > 0) ctx.drawImage(img, 0, 0);
            }
        }

        // ══════════════════════════════════════════════════════════════════════════════
        // Token selection
        // ══════════════════════════════════════════════════════════════════════════════
        function toggleStep(idx) {
            if (selectedSteps.has(idx)) selectedSteps.delete(idx);
            else selectedSteps.add(idx);
            updateTokenUI();
        }

        function onTokenClick(idx, e) {
            if (e.shiftKey && lastClickedStep !== null) {
                const lo = Math.min(lastClickedStep, idx);
                const hi = Math.max(lastClickedStep, idx);
                for (let i = lo; i <= hi; i++) selectedSteps.add(i);
            } else if (e.ctrlKey || e.metaKey) {
                toggleStep(idx);
            } else {
                selectedSteps.clear();
                selectedSteps.add(idx);
            }
            lastClickedStep = idx;
            updateTokenUI();
            fetchAndRender();
        }

        function updateTokenUI() {
            document.querySelectorAll(".token-chip").forEach(chip => {
                chip.classList.toggle("selected", selectedSteps.has(parseInt(chip.dataset.step)));
            });
            document.getElementById("sel-count").textContent = `${selectedSteps.size} selected`;
        }

        document.getElementById("btn-select-all").addEventListener("click", () => {
            for (let i = 0; i < META.num_gen_steps; i++) selectedSteps.add(i);
            updateTokenUI();
            fetchAndRender();
        });

        document.getElementById("btn-clear").addEventListener("click", () => {
            selectedSteps.clear();
            updateTokenUI();
            renderFrames();
        });

        // ══════════════════════════════════════════════════════════════════════════════
        // Controls
        // ══════════════════════════════════════════════════════════════════════════════
        document.getElementById("layer-slider").addEventListener("input", function () {
            document.getElementById("layer-value").textContent = `${this.value} / ${this.max}`;
            fetchAndRender();
        });

        document.getElementById("head-select").addEventListener("change", () => fetchAndRender());

        document.getElementById("opacity-slider").addEventListener("input", function () {
            document.getElementById("opacity-value").textContent = `${this.value}%`;
            renderFrames();
        });

        document.querySelectorAll("[data-agg]").forEach(btn => {
            btn.addEventListener("click", function () {
                document.querySelectorAll("[data-agg]").forEach(b => b.classList.remove("active"));
                this.classList.add("active");
                aggMode = this.dataset.agg;
                fetchAndRender();
            });
        });

        document.getElementById("cmap-select").addEventListener("change", function () {
            currentCmap = this.value;
            drawColormapBar();
            renderFrames();
        });

        // ══════════════════════════════════════════════════════════════════════════════
        // Data fetching
        // ══════════════════════════════════════════════════════════════════════════════
        async function fetchAndRender() {
            if (selectedSteps.size === 0) {
                currentHeatmaps = null;
                renderFrames();
                return;
            }

            const layer = document.getElementById("layer-slider").value;
            const head = document.getElementById("head-select").value;
            const steps = Array.from(selectedSteps).sort((a, b) => a - b).join(",");
            const url = `/api/attention_multi?steps=${steps}&layer=${layer}&head=${head}&agg=${aggMode}`;

            const fetchId = Symbol();
            pendingFetch = fetchId;

            try {
                const res = await fetch(url);
                if (pendingFetch !== fetchId) return;
                const data = await res.json();
                currentHeatmaps = data.heatmaps;   // [num_temporal_groups][h_patches][w_patches]
                renderFrames();
            } catch (e) {
                console.error("Fetch error:", e);
            }
        }

        // ══════════════════════════════════════════════════════════════════════════════
        // Rendering
        //
        // The server always returns heatmaps shaped [TG][HP][WP] regardless of model
        // family.  For compressed VideoLLaMA3, the server scatters sparse tokens back
        // into the full grid (zeros where tokens were removed) before sending.
        // So the frontend rendering logic is identical for both families.
        // ══════════════════════════════════════════════════════════════════════════════
        function renderFrames() {
            const opacity = parseInt(document.getElementById("opacity-slider").value) / 100;
            const tmf = META.temporal_merge_factor;

            for (let i = 0; i < META.num_frames; i++) {
                const canvas = document.getElementById(`canvas-${i}`);
                if (!canvas) continue;
                const ctx = canvas.getContext("2d");
                const img = frameImages[i];

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                if (img.complete && img.naturalWidth > 0) ctx.drawImage(img, 0, 0);

                const scoreEl = document.getElementById(`score-${i}`);

                if (!currentHeatmaps || selectedSteps.size === 0) {
                    if (scoreEl) scoreEl.querySelector(".score-val").textContent = "\u2014";
                    continue;
                }

                // Map frame → temporal group
                const tg = Math.floor(i / tmf);
                if (tg >= currentHeatmaps.length) continue;
                const heatmap = currentHeatmaps[tg];   // [h_patches][w_patches]
                if (!heatmap) continue;

                const hp = META.h_patches;
                const wp = META.w_patches;
                const cellW = canvas.width / wp;
                const cellH = canvas.height / hp;

                ctx.globalAlpha = opacity;
                let attnSum = 0;
                for (let r = 0; r < hp; r++) {
                    for (let c = 0; c < wp; c++) {
                        const v = heatmap[r][c];
                        attnSum += v;
                        const [cr, cg, cb] = cmapColor(v, currentCmap);
                        ctx.fillStyle = `rgb(${cr},${cg},${cb})`;
                        ctx.fillRect(c * cellW, r * cellH, cellW + 0.5, cellH + 0.5);
                    }
                }
                ctx.globalAlpha = 1.0;

                if (scoreEl) scoreEl.querySelector(".score-val").textContent = attnSum.toFixed(4);
            }
        }

        function drawColormapBar() {
            const canvas = document.getElementById("colormap-bar");
            const ctx = canvas.getContext("2d");
            for (let x = 0; x < canvas.width; x++) {
                const t = x / (canvas.width - 1);
                const [r, g, b] = cmapColor(t, currentCmap);
                ctx.fillStyle = `rgb(${r},${g},${b})`;
                ctx.fillRect(x, 0, 1, canvas.height);
            }
        }

        // ══════════════════════════════════════════════════════════════════════════════
        // Boot
        // ══════════════════════════════════════════════════════════════════════════════
        init();
    </script>
</body>

</html>
