<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VLM Attention Visualizer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@400;500;600;700;800&display=swap');

  :root {
    --bg:          #0a0b10;
    --bg-panel:    #111318;
    --bg-card:     #161921;
    --bg-raised:   #1c1f2a;
    --border:      #252936;
    --border-hi:   #363c4f;
    --text:        #b8bdc9;
    --text-dim:    #5c6272;
    --text-bright: #e8eaf0;
    --accent:      #5b8def;
    --accent-dim:  #253660;
    --fwd-color:   #5b8def;
    --fwd-dim:     #253660;
    --bwd-color:   #f59e0b;
    --bwd-dim:     rgba(245, 158, 11, 0.12);
    --bwd-sel:     rgba(245, 158, 11, 0.45);
    --coord-fwd:   rgba(91, 141, 239, 0.25);
    --coord-bwd:   rgba(245, 158, 11, 0.18);
    --mono:        'JetBrains Mono', monospace;
    --sans:        'Outfit', -apple-system, sans-serif;
    --radius:      6px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: var(--sans); background: var(--bg); color: var(--text); min-height: 100vh; }

  /* ── Header ────────────────────────────────────── */
  .header {
    padding: 18px 28px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-panel);
    display: flex; align-items: center; gap: 14px;
  }
  .header h1 { font-size: 17px; font-weight: 800; color: var(--text-bright); letter-spacing: -0.5px; }
  .header .pill {
    font-size: 10px; padding: 3px 9px; border-radius: 100px;
    font-weight: 600; font-family: var(--mono);
  }
  .pill-model { background: var(--accent-dim); color: var(--accent); }
  .pill-family { background: rgba(245,158,11,0.12); color: #f59e0b; }
  .header .meta { font-size: 11px; color: var(--text-dim); font-family: var(--mono); margin-left: auto; }

  .prompt-bar {
    padding: 9px 28px; font-size: 11px; color: var(--text-dim);
    border-bottom: 1px solid var(--border); background: var(--bg);
    font-family: var(--mono); display: flex; gap: 8px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .prompt-bar strong { color: var(--text); }

  /* ── Shared Controls ───────────────────────────── */
  .controls {
    padding: 12px 28px; border-bottom: 1px solid var(--border);
    display: flex; gap: 28px; align-items: center; flex-wrap: wrap;
    background: var(--bg-panel);
  }
  .ctrl { display: flex; align-items: center; gap: 8px; }
  .ctrl label {
    font-size: 10px; font-weight: 600; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 0.6px;
  }
  .ctrl input[type="range"] { width: 160px; accent-color: var(--accent); }
  .ctrl select {
    font-family: var(--mono); font-size: 11px; padding: 4px 8px;
    border-radius: var(--radius); border: 1px solid var(--border);
    background: var(--bg-raised); color: var(--text); cursor: pointer;
  }
  .ctrl-val { font-family: var(--mono); font-size: 12px; color: var(--accent); min-width: 44px; }

  .cmap-legend { display: flex; align-items: center; gap: 6px; margin-left: auto; }
  .cmap-legend canvas { border-radius: 2px; border: 1px solid var(--border); }
  .cmap-legend span { font-family: var(--mono); font-size: 9px; color: var(--text-dim); }

  /* ── View Panels ───────────────────────────────── */
  .view-panel {
    border-bottom: 1px solid var(--border);
    padding: 18px 28px 22px;
  }
  .view-header {
    display: flex; align-items: center; gap: 12px; margin-bottom: 14px;
  }
  .view-tag {
    font-size: 9px; font-weight: 700; letter-spacing: 1px;
    text-transform: uppercase; padding: 3px 8px; border-radius: 3px;
    font-family: var(--mono);
  }
  .view-tag-fwd { background: var(--fwd-dim); color: var(--fwd-color); }
  .view-tag-bwd { background: var(--bwd-dim); color: var(--bwd-color); }
  .view-desc { font-size: 12px; color: var(--text-dim); }
  .view-actions {
    display: flex; gap: 6px; align-items: center; margin-left: auto;
  }
  .view-actions button, .view-actions .btn-sm {
    font-family: var(--sans); font-size: 11px; padding: 3px 10px;
    border-radius: var(--radius); border: 1px solid var(--border);
    background: var(--bg-raised); color: var(--text); cursor: pointer;
    transition: all 0.12s;
  }
  .view-actions button:hover { border-color: var(--accent); color: var(--accent); }
  .btn-group-sm { display: flex; gap: 1px; }
  .btn-group-sm button { border-radius: 0; }
  .btn-group-sm button:first-child { border-radius: var(--radius) 0 0 var(--radius); }
  .btn-group-sm button:last-child  { border-radius: 0 var(--radius) var(--radius) 0; }
  .btn-group-sm button.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
  .view-stat { font-size: 11px; color: var(--text-dim); font-family: var(--mono); }

  /* ── Token Bars ────────────────────────────────── */
  .token-bar {
    display: flex; flex-wrap: wrap; gap: 3px;
    max-height: 90px; overflow-y: auto; padding: 2px 0; margin-bottom: 12px;
  }
  .tok {
    font-family: var(--mono); font-size: 11px;
    padding: 3px 6px; border-radius: 3px;
    border: 1px solid var(--border);
    background: var(--bg-raised); color: var(--text);
    cursor: pointer; transition: all 0.1s;
    user-select: none; white-space: pre; line-height: 1.3;
    position: relative;
  }
  .tok .ix { font-size: 8px; color: var(--text-dim); margin-right: 2px; vertical-align: super; }
  .tok:hover { border-color: var(--accent); }

  /* Forward selected tokens */
  .tok.fwd-sel {
    border-color: var(--fwd-color); background: var(--fwd-dim); color: var(--fwd-color); font-weight: 600;
  }
  /* Backward coordination indicator on forward tokens */
  .tok .coord-bar {
    position: absolute; bottom: 0; left: 0; right: 0; height: 2px;
    border-radius: 0 0 2px 2px; background: transparent;
  }

  /* Backward token heatmap */
  .tok-heat {
    font-family: var(--mono); font-size: 11px;
    padding: 3px 6px; border-radius: 3px;
    border: 1px solid var(--border);
    background: var(--bg-raised); color: var(--text);
    white-space: pre; line-height: 1.3;
    position: relative; transition: all 0.1s;
  }
  .tok-heat .ix { font-size: 8px; color: var(--text-dim); margin-right: 2px; vertical-align: super; }
  .tok-heat .tip {
    display: none; position: absolute; bottom: calc(100% + 4px); left: 50%;
    transform: translateX(-50%); padding: 2px 7px;
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 3px; font-size: 9px; color: var(--bwd-color);
    white-space: nowrap; z-index: 20;
  }
  .tok-heat:hover .tip { display: block; }

  /* ── Frame Strips ──────────────────────────────── */
  .frame-strip {
    display: flex; gap: 10px; overflow-x: auto;
    padding: 4px 0 8px; scroll-snap-type: x proximity;
  }
  .frame-strip::-webkit-scrollbar { height: 5px; }
  .frame-strip::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .fcard {
    flex: 0 0 auto; width: 260px;
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden;
    scroll-snap-align: start; transition: border-color 0.12s;
  }
  .fcard:hover { border-color: var(--border-hi); }
  .fcard-head {
    padding: 5px 10px; display: flex; justify-content: space-between;
    align-items: center; border-bottom: 1px solid var(--border);
    font-size: 10px;
  }
  .fcard-head .ft { font-weight: 600; color: var(--text-bright); }
  .fcard-head .tg {
    font-family: var(--mono); font-size: 9px; padding: 1px 5px;
    border-radius: 3px; background: var(--bg-raised); color: var(--text-dim);
  }
  .fcard-canvas { position: relative; width: 100%; background: #000; }
  .fcard-canvas canvas { display: block; width: 100%; height: auto; }
  .fcard-foot {
    padding: 4px 10px; font-family: var(--mono); font-size: 10px;
    color: var(--text-dim); border-top: 1px solid var(--border);
    display: flex; justify-content: space-between;
  }
  .fcard-foot .sv { color: var(--accent); }

  /* Backward frame cards with crosshair */
  .bwd-strip .fcard-canvas { cursor: crosshair; }

  /* ── Loading ───────────────────────────────────── */
  .loading {
    position: fixed; inset: 0; background: rgba(10,11,16,0.92);
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; z-index: 100; gap: 14px;
  }
  .loading.hidden { display: none; }
  .spin {
    width: 28px; height: 28px; border: 3px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: sp 0.7s linear infinite;
  }
  @keyframes sp { to { transform: rotate(360deg); } }

  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<div class="loading" id="loading">
  <div class="spin"></div>
  <div style="font-size:13px;color:var(--text-dim)">Loading attention data</div>
</div>

<!-- HEADER -->
<div class="header">
  <h1>VLM Attention Visualizer</h1>
  <span class="pill pill-model" id="hd-model">-</span>
  <span class="pill pill-family" id="hd-family">-</span>
  <span class="meta" id="hd-stats">-</span>
</div>
<div class="prompt-bar">
  <strong>Prompt:</strong> <span id="hd-prompt">-</span>
</div>

<!-- SHARED CONTROLS -->
<div class="controls">
  <div class="ctrl">
    <label>Layer</label>
    <input type="range" id="layer-sl" min="0" max="0" value="0">
    <span class="ctrl-val" id="layer-val">0</span>
  </div>
  <div class="ctrl">
    <label>Head</label>
    <select id="head-sel"><option value="avg" selected>Avg</option></select>
  </div>
  <div class="ctrl">
    <label>Opacity</label>
    <input type="range" id="opac-sl" min="0" max="100" value="55">
    <span class="ctrl-val" id="opac-val">55%</span>
  </div>
  <div class="ctrl">
    <label>Cmap</label>
    <select id="cmap-sel">
      <option value="inferno" selected>Inferno</option>
      <option value="hot">Hot</option>
      <option value="viridis">Viridis</option>
      <option value="plasma">Plasma</option>
      <option value="magma">Magma</option>
      <option value="turbo">Turbo</option>
    </select>
  </div>
  <div class="cmap-legend">
    <span>Low</span>
    <canvas id="cmap-bar" width="100" height="10"></canvas>
    <span>High</span>
  </div>
</div>

<!-- ═══ FORWARD VIEW ═══ -->
<div class="view-panel" id="fwd-panel">
  <div class="view-header">
    <span class="view-tag view-tag-fwd">FORWARD</span>
    <span class="view-desc">Select tokens → see where the model looked in each frame</span>
    <div class="view-actions">
      <button id="fwd-all">Select All</button>
      <button id="fwd-clear">Clear</button>
      <div class="btn-group-sm">
        <button class="active" data-fwd-agg="mean">Mean</button>
        <button data-fwd-agg="max">Max</button>
      </div>
      <span class="view-stat" id="fwd-stat">0 selected</span>
    </div>
  </div>
  <div class="token-bar" id="fwd-tokens"></div>
  <div class="frame-strip" id="fwd-frames"></div>
</div>

<!-- ═══ BACKWARD VIEW ═══ -->
<div class="view-panel" id="bwd-panel">
  <div class="view-header">
    <span class="view-tag view-tag-bwd">BACKWARD</span>
    <span class="view-desc">Select patches on frames → see which tokens they influenced</span>
    <div class="view-actions">
      <button id="bwd-clear">Clear</button>
      <div class="btn-group-sm">
        <button class="active" data-bwd-agg="sum">Sum</button>
        <button data-bwd-agg="mean">Mean</button>
      </div>
      <span class="view-stat" id="bwd-stat">0 patches</span>
    </div>
  </div>
  <div class="frame-strip bwd-strip" id="bwd-frames"></div>
  <div class="token-bar" id="bwd-tokens" style="margin-top:12px"></div>
</div>

<script>
// ═════════════════════════════════════════════════════════════════════
// Colormaps
// ═════════════════════════════════════════════════════════════════════
const CM={};
function bLUT(kp){const l=new Array(256);for(let i=0;i<256;i++){const t=i/255;let a=kp[0],b=kp[kp.length-1];for(let k=0;k<kp.length-1;k++){if(t>=kp[k][0]&&t<=kp[k+1][0]){a=kp[k];b=kp[k+1];break;}}const f=(b[0]-a[0])>0?(t-a[0])/(b[0]-a[0]):0;l[i]=[Math.round(a[1]+f*(b[1]-a[1])),Math.round(a[2]+f*(b[2]-a[2])),Math.round(a[3]+f*(b[3]-a[3]))];}return l;}
CM.inferno=bLUT([[0,0,0,4],[.13,31,12,72],[.25,85,15,109],[.38,136,34,106],[.5,186,54,85],[.63,227,89,51],[.75,249,140,10],[.88,249,200,40],[1,252,255,164]]);
CM.hot=bLUT([[0,0,0,0],[.33,230,0,0],[.66,255,200,0],[1,255,255,255]]);
CM.viridis=bLUT([[0,68,1,84],[.13,72,35,116],[.25,64,67,135],[.38,52,94,141],[.5,33,145,140],[.63,53,183,121],[.75,109,205,89],[.88,180,222,44],[1,253,231,37]]);
CM.plasma=bLUT([[0,13,8,135],[.13,75,3,161],[.25,126,3,168],[.38,168,34,150],[.5,203,70,121],[.63,229,107,93],[.75,248,148,65],[.88,253,195,40],[1,240,249,33]]);
CM.magma=bLUT([[0,0,0,4],[.13,28,16,68],[.25,79,18,123],[.38,129,37,129],[.5,181,54,122],[.63,229,80,100],[.75,251,135,97],[.88,254,194,140],[1,252,253,191]]);
CM.turbo=bLUT([[0,48,18,59],[.13,67,96,211],[.25,30,156,240],[.38,18,206,170],[.5,82,237,93],[.63,183,243,33],[.75,243,195,28],[.88,244,116,15],[1,122,4,3]]);
function cc(t,n){const l=CM[n]||CM.inferno;return l[Math.max(0,Math.min(255,Math.round(t*255)))];}

// ═════════════════════════════════════════════════════════════════════
// State
// ═════════════════════════════════════════════════════════════════════
let M=null;
let cmap="inferno", fwdAgg="mean", bwdAgg="sum";

// Forward state
let fwdSel=new Set(), fwdLast=null, fwdHeatmaps=null;
let fwdImgs=[], fwdCanvases=[];

// Backward state
let bwdPatches=new Set(), bwdScores=null, bwdScoresNorm=null;
let bwdImgs=[], bwdCanvases=[];
let isDrag=false, paintMode=true;

// Coordination
let bwdCoordScores=null;  // backward scores shown on forward token bar
let fwdCoordHeatmaps=null; // forward heatmaps shown on backward frames

let pendingFwd=null, pendingBwd=null;

// ═════════════════════════════════════════════════════════════════════
// Init
// ═════════════════════════════════════════════════════════════════════
async function init(){
  const r=await fetch("/api/metadata"); M=await r.json();

  // Header
  document.getElementById("hd-model").textContent=M.model.split("/").pop();
  document.getElementById("hd-family").textContent=M.model_family||"unknown";
  document.getElementById("hd-stats").textContent=`${M.num_layers}L · ${M.num_heads}H · ${M.num_frames}F · ${M.num_gen_steps}T`;
  document.getElementById("hd-prompt").textContent=M.prompt;

  // Controls
  const ls=document.getElementById("layer-sl"); ls.max=M.num_layers-1; ls.value=M.num_layers-1;
  document.getElementById("layer-val").textContent=ls.value;
  if(M.has_full_attention){const h=document.getElementById("head-sel");for(let i=0;i<M.num_heads;i++){const o=document.createElement("option");o.value=i;o.textContent=`H${i}`;h.appendChild(o);}}

  // Build forward tokens
  buildFwdTokens();
  // Build backward tokens
  buildBwdTokens();
  // Load frames for both views
  await Promise.all([loadFwdFrames(), loadBwdFrames()]);

  // Default: select first token in forward
  fwdSel.add(0); updateFwdTokenUI(); fetchForward();

  document.getElementById("loading").classList.add("hidden");
  drawCmapBar();
}

function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

// ═════════════════════════════════════════════════════════════════════
// Forward View
// ═════════════════════════════════════════════════════════════════════
function buildFwdTokens(){
  const bar=document.getElementById("fwd-tokens"); bar.innerHTML="";
  M.generated_tokens.forEach((t,i)=>{
    const d=document.createElement("div"); d.className="tok"; d.dataset.i=i;
    const txt=t.replace(/ /g,"·").replace(/\n/g,"↵")||"·";
    d.innerHTML=`<span class="ix">${i}</span>${esc(txt)}<div class="coord-bar"></div>`;
    d.addEventListener("click",e=>onFwdClick(i,e));
    bar.appendChild(d);
  });
}

function onFwdClick(i,e){
  if(e.shiftKey&&fwdLast!==null){const lo=Math.min(fwdLast,i),hi=Math.max(fwdLast,i);for(let j=lo;j<=hi;j++)fwdSel.add(j);}
  else{if(fwdSel.has(i))fwdSel.delete(i);else fwdSel.add(i);}
  fwdLast=i; updateFwdTokenUI(); fetchForward();
}

function updateFwdTokenUI(){
  document.querySelectorAll("#fwd-tokens .tok").forEach(d=>{
    d.classList.toggle("fwd-sel",fwdSel.has(+d.dataset.i));
  });
  document.getElementById("fwd-stat").textContent=`${fwdSel.size} selected`;
}

async function loadFwdFrames(){
  const strip=document.getElementById("fwd-frames"); strip.innerHTML="";
  fwdImgs=[]; fwdCanvases=[];
  for(let i=0;i<M.num_frames;i++){
    const tg=Math.floor(i/M.temporal_merge_factor);
    const card=document.createElement("div"); card.className="fcard";
    card.innerHTML=`<div class="fcard-head"><span class="ft">Frame ${i}</span><span class="tg">TG ${tg}</span></div><div class="fcard-canvas"><canvas id="fc-${i}"></canvas></div><div class="fcard-foot"><span>Attn</span><span class="sv" id="fs-${i}">-</span></div>`;
    strip.appendChild(card);
    const img=new Image(); img.crossOrigin="anonymous"; img.src=`/api/frames/${i}`;
    fwdImgs.push(img);
    await new Promise(r=>{img.onload=r;img.onerror=r;});
    const c=document.getElementById(`fc-${i}`);
    c.width=img.naturalWidth; c.height=img.naturalHeight;
    c.getContext("2d").drawImage(img,0,0);
    fwdCanvases.push(c);
  }
}

async function fetchForward(){
  if(fwdSel.size===0){fwdHeatmaps=null;fwdCoordHeatmaps=null;renderFwdFrames();renderBwdCoord();return;}
  const layer=document.getElementById("layer-sl").value;
  const head=document.getElementById("head-sel").value;
  const steps=Array.from(fwdSel).sort((a,b)=>a-b).join(",");
  const url=`/api/attention_multi?steps=${steps}&layer=${layer}&head=${head}&agg=${fwdAgg}`;
  const id=Symbol(); pendingFwd=id;
  try{
    const r=await fetch(url); if(pendingFwd!==id)return;
    const d=await r.json();
    fwdHeatmaps=d.heatmaps;
    fwdCoordHeatmaps=d.heatmaps; // share with backward for coordination
    renderFwdFrames();
    renderBwdCoord(); // update backward frames with coordination overlay
  }catch(e){console.error(e);}
}

function renderFwdFrames(){
  const opac=parseInt(document.getElementById("opac-sl").value)/100;
  for(let i=0;i<M.num_frames;i++){
    const c=fwdCanvases[i]; if(!c)continue;
    const ctx=c.getContext("2d"); const img=fwdImgs[i];
    ctx.clearRect(0,0,c.width,c.height);
    if(img.complete&&img.naturalWidth>0)ctx.drawImage(img,0,0);
    const sEl=document.getElementById(`fs-${i}`);
    if(!fwdHeatmaps||fwdSel.size===0){if(sEl)sEl.textContent="-";continue;}
    const tg=Math.floor(i/M.temporal_merge_factor);
    const hm=fwdHeatmaps[tg]; if(!hm)continue;
    const hp=M.h_patches,wp=M.w_patches,cW=c.width/wp,cH=c.height/hp;
    ctx.globalAlpha=opac; let sum=0;
    for(let r=0;r<hp;r++)for(let cl=0;cl<wp;cl++){
      const v=hm[r][cl]; sum+=v;
      const[cr,cg,cb]=cc(v,cmap);
      ctx.fillStyle=`rgb(${cr},${cg},${cb})`; ctx.fillRect(cl*cW,r*cH,cW+.5,cH+.5);
    }
    ctx.globalAlpha=1;
    if(sEl)sEl.textContent=sum.toFixed(4);
  }
}

// ═════════════════════════════════════════════════════════════════════
// Backward View
// ═════════════════════════════════════════════════════════════════════
function buildBwdTokens(){
  const bar=document.getElementById("bwd-tokens"); bar.innerHTML="";
  M.generated_tokens.forEach((t,i)=>{
    const d=document.createElement("div"); d.className="tok-heat"; d.id=`bt-${i}`;
    const txt=t.replace(/ /g,"·").replace(/\n/g,"↵")||"·";
    d.innerHTML=`<span class="ix">${i}</span>${esc(txt)}<span class="tip" id="btp-${i}">-</span>`;
    bar.appendChild(d);
  });
}

async function loadBwdFrames(){
  const strip=document.getElementById("bwd-frames"); strip.innerHTML="";
  bwdImgs=[]; bwdCanvases=[];
  for(let i=0;i<M.num_frames;i++){
    const tg=Math.floor(i/M.temporal_merge_factor);
    const card=document.createElement("div"); card.className="fcard";
    card.innerHTML=`<div class="fcard-head"><span class="ft">Frame ${i}</span><span class="tg">TG ${tg}</span></div><div class="fcard-canvas"><canvas id="bc-${i}" data-fi="${i}" data-tg="${tg}"></canvas></div><div class="fcard-foot" id="bf-${i}">0 selected</div>`;
    strip.appendChild(card);
    const img=new Image(); img.crossOrigin="anonymous"; img.src=`/api/frames/${i}`;
    bwdImgs.push(img);
    await new Promise(r=>{img.onload=r;img.onerror=r;});
    const c=document.getElementById(`bc-${i}`);
    c.width=img.naturalWidth; c.height=img.naturalHeight;
    bwdCanvases.push(c);
    drawBwdFrame(i);

    c.addEventListener("mousedown",e=>onBwdDown(e,c));
    c.addEventListener("mousemove",e=>onBwdMove(e,c));
    c.addEventListener("mouseup",()=>{isDrag=false;});
    c.addEventListener("mouseleave",()=>{isDrag=false;});
  }
  document.addEventListener("mouseup",()=>{isDrag=false;});
}

function drawBwdFrame(fi){
  const c=bwdCanvases[fi]; if(!c)return;
  const ctx=c.getContext("2d"); const img=bwdImgs[fi];
  const tg=Math.floor(fi/M.temporal_merge_factor);
  ctx.clearRect(0,0,c.width,c.height);
  if(img.complete&&img.naturalWidth>0)ctx.drawImage(img,0,0);

  const hp=M.h_patches,wp=M.w_patches;
  const cW=c.width/wp,cH=c.height/hp;

  // Grid lines
  ctx.strokeStyle="rgba(255,255,255,0.06)"; ctx.lineWidth=0.5;
  for(let r=0;r<=hp;r++){ctx.beginPath();ctx.moveTo(0,r*cH);ctx.lineTo(c.width,r*cH);ctx.stroke();}
  for(let cl=0;cl<=wp;cl++){ctx.beginPath();ctx.moveTo(cl*cW,0);ctx.lineTo(cl*cW,c.height);ctx.stroke();}

  // Coordination: show forward heatmap as subtle overlay on backward frames
  if(fwdCoordHeatmaps&&fwdSel.size>0){
    const hm=fwdCoordHeatmaps[tg];
    if(hm){
      ctx.globalAlpha=0.18;
      for(let r=0;r<hp;r++)for(let cl=0;cl<wp;cl++){
        const v=hm[r][cl];
        if(v>0.3){ // only show strong attention
          const[cr,cg,cb]=cc(v,cmap);
          ctx.fillStyle=`rgb(${cr},${cg},${cb})`;
          ctx.fillRect(cl*cW,r*cH,cW,cH);
        }
      }
      ctx.globalAlpha=1;
    }
  }

  // Selected patches
  let count=0;
  for(let r=0;r<hp;r++)for(let cl=0;cl<wp;cl++){
    if(bwdPatches.has(`${tg}:${r}:${cl}`)){
      ctx.fillStyle="rgba(245,158,11,0.4)"; ctx.fillRect(cl*cW,r*cH,cW,cH);
      ctx.strokeStyle="rgba(245,158,11,0.85)"; ctx.lineWidth=1.5;
      ctx.strokeRect(cl*cW+.5,r*cH+.5,cW-1,cH-1);
      count++;
    }
  }
  const ft=document.getElementById(`bf-${fi}`);
  if(ft)ft.textContent=`${count} selected`;
}

function bwdCell(e,c){
  const r=c.getBoundingClientRect();
  const x=(e.clientX-r.left)*(c.width/r.width);
  const y=(e.clientY-r.top)*(c.height/r.height);
  const col=Math.floor(x/(c.width/M.w_patches));
  const row=Math.floor(y/(c.height/M.h_patches));
  if(row<0||row>=M.h_patches||col<0||col>=M.w_patches)return null;
  return{row,col,tg:+c.dataset.tg};
}

function onBwdDown(e,c){
  e.preventDefault(); const cell=bwdCell(e,c); if(!cell)return;
  isDrag=true; const k=`${cell.tg}:${cell.row}:${cell.col}`;
  if(e.shiftKey){paintMode=false;bwdPatches.delete(k);}
  else{if(bwdPatches.has(k)){bwdPatches.delete(k);paintMode=false;}else{bwdPatches.add(k);paintMode=true;}}
  redrawBwd(); updateBwdStat(); fetchBackward();
}

function onBwdMove(e,c){
  if(!isDrag)return; const cell=bwdCell(e,c); if(!cell)return;
  const k=`${cell.tg}:${cell.row}:${cell.col}`;
  if(paintMode){if(!bwdPatches.has(k)){bwdPatches.add(k);redrawBwd();updateBwdStat();}}
  else{if(bwdPatches.has(k)){bwdPatches.delete(k);redrawBwd();updateBwdStat();}}
}

function redrawBwd(){for(let i=0;i<M.num_frames;i++)drawBwdFrame(i);}
function updateBwdStat(){document.getElementById("bwd-stat").textContent=`${bwdPatches.size} patches`;}

let bwdTimer=null;
function fetchBackward(){clearTimeout(bwdTimer);bwdTimer=setTimeout(_fetchBwd,120);}

async function _fetchBwd(){
  if(bwdPatches.size===0){bwdScores=null;bwdScoresNorm=null;bwdCoordScores=null;renderBwdTokens();renderFwdCoord();return;}
  const layer=+document.getElementById("layer-sl").value;
  const head=document.getElementById("head-sel").value;
  const patches=[];
  for(const k of bwdPatches){const[tg,r,c]=k.split(":").map(Number);patches.push({tg,row:r,col:c});}
  const id=Symbol(); pendingBwd=id;
  try{
    const res=await fetch("/api/attention_backward",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({patches,layer,head,agg:bwdAgg})});
    if(pendingBwd!==id)return;
    const d=await res.json();
    bwdScores=d.scores; bwdScoresNorm=d.scores_norm;
    bwdCoordScores=d.scores_norm; // coordination
    renderBwdTokens();
    renderFwdCoord(); // update forward token bar
  }catch(e){console.error(e);}
}

function renderBwdTokens(){
  for(let i=0;i<M.num_gen_steps;i++){
    const el=document.getElementById(`bt-${i}`);
    const tip=document.getElementById(`btp-${i}`);
    if(!el)continue;
    if(!bwdScoresNorm||bwdPatches.size===0){
      el.style.background="var(--bg-raised)"; el.style.color="var(--text)";
      el.style.borderColor="var(--border)";
      if(tip)tip.textContent="-"; continue;
    }
    const n=bwdScoresNorm[i], raw=bwdScores[i];
    const[r,g,b]=cc(n,cmap);
    el.style.background=`rgb(${r},${g},${b})`;
    el.style.borderColor=`rgba(${r},${g},${b},0.7)`;
    const lum=.299*r+.587*g+.114*b;
    el.style.color=lum>140?"#0a0b10":"#e8eaf0";
    if(tip)tip.textContent=raw.toExponential(3);
  }
}

// ═════════════════════════════════════════════════════════════════════
// Coordination: backward → forward
// ═════════════════════════════════════════════════════════════════════
function renderFwdCoord(){
  // Show backward scores as a colored bottom bar on forward tokens
  document.querySelectorAll("#fwd-tokens .tok .coord-bar").forEach((bar,i)=>{
    if(!bwdCoordScores||bwdPatches.size===0){
      bar.style.background="transparent"; return;
    }
    const n=bwdCoordScores[i]||0;
    if(n>0.1){
      const[r,g,b]=cc(n,cmap);
      bar.style.background=`rgb(${r},${g},${b})`;
    } else {
      bar.style.background="transparent";
    }
  });
}

// Coordination: forward → backward
function renderBwdCoord(){
  // Forward heatmaps already shown as subtle overlay in drawBwdFrame
  redrawBwd();
}

// ═════════════════════════════════════════════════════════════════════
// Shared Controls
// ═════════════════════════════════════════════════════════════════════
document.getElementById("layer-sl").addEventListener("input",function(){
  document.getElementById("layer-val").textContent=this.value;
  fetchForward(); fetchBackward();
});
document.getElementById("head-sel").addEventListener("change",()=>{fetchForward();fetchBackward();});
document.getElementById("opac-sl").addEventListener("input",function(){
  document.getElementById("opac-val").textContent=this.value+"%"; renderFwdFrames();
});
document.getElementById("cmap-sel").addEventListener("change",function(){
  cmap=this.value; drawCmapBar(); renderFwdFrames(); renderBwdTokens(); renderFwdCoord(); redrawBwd();
});

// Forward controls
document.getElementById("fwd-all").addEventListener("click",()=>{for(let i=0;i<M.num_gen_steps;i++)fwdSel.add(i);updateFwdTokenUI();fetchForward();});
document.getElementById("fwd-clear").addEventListener("click",()=>{fwdSel.clear();updateFwdTokenUI();fwdHeatmaps=null;fwdCoordHeatmaps=null;renderFwdFrames();renderBwdCoord();});
document.querySelectorAll("[data-fwd-agg]").forEach(b=>{b.addEventListener("click",function(){document.querySelectorAll("[data-fwd-agg]").forEach(x=>x.classList.remove("active"));this.classList.add("active");fwdAgg=this.dataset.fwdAgg;fetchForward();});});

// Backward controls
document.getElementById("bwd-clear").addEventListener("click",()=>{bwdPatches.clear();redrawBwd();updateBwdStat();bwdScores=null;bwdScoresNorm=null;bwdCoordScores=null;renderBwdTokens();renderFwdCoord();});
document.querySelectorAll("[data-bwd-agg]").forEach(b=>{b.addEventListener("click",function(){document.querySelectorAll("[data-bwd-agg]").forEach(x=>x.classList.remove("active"));this.classList.add("active");bwdAgg=this.dataset.bwdAgg;fetchBackward();});});

function drawCmapBar(){
  const c=document.getElementById("cmap-bar"),ctx=c.getContext("2d");
  for(let x=0;x<c.width;x++){const t=x/(c.width-1);const[r,g,b]=cc(t,cmap);ctx.fillStyle=`rgb(${r},${g},${b})`;ctx.fillRect(x,0,1,c.height);}
}

// ═════════════════════════════════════════════════════════════════════
init();
</script>
